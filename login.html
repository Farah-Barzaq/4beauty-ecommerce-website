<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account - 4beauty</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Auth Container -->
      <main class="auth-section">
        <div class="auth-card">
          <div class="auth-toggle-btns">
            <button id="show-login-btn" class="auth-tab-btn active">
              Login
            </button>
            <button id="show-register-btn" class="auth-tab-btn">
              Register
            </button>
          </div>

          <form id="login-form" class="auth-form active">
            <h2>Welcome Back</h2>
            <p class="auth-desc">Log in to manage your orders & profile</p>

            <div class="form-group">
              <label>Email</label>
              <div class="input-box">
                <i class="fa-regular fa-envelope"></i>
                <input
                  type="email"
                  id="login-email"
                  placeholder="Enter your email"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label>Password</label>
              <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input
                  type="password"
                  id="login-password"
                  placeholder="Enter password"
                  required
                />
              </div>
            </div>

            <button type="submit" class="submit-btn">Login</button>
          </form>

          <form id="register-form" class="auth-form">
            <h2>Create Account</h2>
            <p class="auth-desc">Join 4beauty for exclusive beauty deals</p>

            <div class="form-group">
              <label>Full Name</label>
              <div class="input-box">
                <i class="fa-regular fa-user"></i>
                <input
                  type="text"
                  id="reg-name"
                  placeholder="Farah Barzaq"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label>Email</label>
              <div class="input-box">
                <i class="fa-regular fa-envelope"></i>
                <input
                  type="email"
                  id="reg-email"
                  placeholder="example@domain.com"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label>Password</label>
              <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input
                  type="password"
                  id="reg-password"
                  placeholder="Create password"
                  required
                />
              </div>
            </div>

            <button type="submit" class="submit-btn" id="reg-submit-btn">
              Register
            </button>
          </form>
        </div>
      </main>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
